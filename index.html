<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vocab Master</title>
<style>
/* ================================================================
   VOCABULARY MASTER — Modular Web App Template
   To update content: edit GAME_CONFIG at the top of <script>.
   To add a mission type: call MissionRegistry.register() once.
   ================================================================ */

@import url('https://fonts.loli.net/css2?family=Nunito:wght@700;800;900&display=swap');

:root {
  --bg:           #08081a;
  --surface:      rgba(255,255,255,0.06);
  --border:       rgba(255,255,255,0.11);
  --neon-cyan:    #00e5ff;
  --neon-purple:  #bf40ff;
  --neon-green:   #39ff14;
  --neon-red:     #ff3535;
  --neon-yellow:  #ffd600;
  --text:         #f0f0ff;
  --text-dim:     rgba(240,240,255,0.45);
  --font:         'Nunito', system-ui, -apple-system, sans-serif;
  --radius:       18px;
  --tile-radius:  20px;
  --spring:       cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease:         cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background-color: var(--bg);
  background-image: radial-gradient(circle, rgba(255,255,255,0.045) 1.5px, transparent 1.5px);
  background-size: 28px 28px;
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ── Ambient glow orbs ── */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
  z-index: 0;
}
body::before {
  width: 460px; height: 460px;
  background: radial-gradient(circle, rgba(0,229,255,0.13), transparent 70%);
  top: -140px; left: -120px;
}
body::after {
  width: 520px; height: 520px;
  background: radial-gradient(circle, rgba(191,64,255,0.11), transparent 70%);
  bottom: -160px; right: -140px;
}

/* ── Screen system ── */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.4s var(--ease);
  z-index: 1;
}
.screen.active { opacity: 1; pointer-events: all; }


/* ════════════════════════════════════════════
   SPLASH SCREEN
   ════════════════════════════════════════════ */
#splash { gap: 22px; }

.splash-logo {
  font-size: clamp(3rem, 11vw, 5rem);
  font-weight: 900;
  line-height: 1;
  text-align: center;
  color: #f5c400;
  text-shadow: 4px 4px 0 #c09500, 5px 6px 8px rgba(0,0,0,0.5);
  letter-spacing: 2px;
}
.splash-sub {
  font-size: clamp(0.75rem, 2.5vw, 0.95rem);
  font-weight: 800;
  color: var(--text-dim);
  letter-spacing: 3px;
  text-transform: uppercase;
  text-align: center;
}
.splash-modes {
  display: flex; gap: 14px;
}
.splash-mode-chip {
  background: var(--surface);
  border: 2px solid var(--border);
  border-bottom: 4px solid rgba(0,0,0,0.3);
  border-radius: 12px;
  padding: 10px 16px;
  font-size: 0.78rem; font-weight: 800;
  letter-spacing: 1px;
  color: var(--text);
  text-align: center;
}
.splash-pb-row {
  font-size: 0.88rem; font-weight: 800;
  color: var(--neon-yellow);
  letter-spacing: 1px;
}
.splash-pb-row span { color: white; }

.btn-start {
  background: #da1c1c;
  border: none;
  border-radius: 12px;
  border-bottom: 6px solid #9c1010;
  padding: 20px 72px;
  font-family: var(--font);
  font-size: 1.3rem; font-weight: 900;
  color: #ffffff;
  cursor: pointer;
  letter-spacing: 3px;
  text-transform: uppercase;
  box-shadow: 0 6px 0 rgba(0,0,0,0.3), 0 10px 20px rgba(218,28,28,0.4);
  transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease), opacity 0.3s var(--ease);
  position: relative;
}
.btn-start::after {
  content: '';
  position: absolute;
  top: 8px; right: 12px;
  width: 11px; height: 11px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  border: 1.5px solid rgba(0,0,0,0.18);
  box-shadow: -17px 0 0 rgba(255,255,255,0.25);
}
.btn-start:hover  { transform: translateY(-2px); box-shadow: 0 8px 0 rgba(0,0,0,0.3), 0 14px 24px rgba(218,28,28,0.5); }
.btn-start:active { transform: translateY(3px);  box-shadow: 0 2px 0 rgba(0,0,0,0.3); border-bottom-width: 2px; }
.btn-start:disabled { opacity: 0.45; pointer-events: none; cursor: default; }

/* ── Asset loading indicator ── */
#loading-status {
  font-size: 0.72rem; font-weight: 800;
  letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--neon-cyan); text-align: center;
  min-height: 1.2em;
  animation: loadingPulse 1.1s ease-in-out infinite alternate;
}
#loading-status.ready {
  color: var(--neon-green);
  animation: none;
}
@keyframes loadingPulse {
  to { opacity: 0.35; }
}


/* ════════════════════════════════════════════
   GAME SCREEN
   ════════════════════════════════════════════ */
#game {
  justify-content: flex-start;
  padding: 0;
  gap: 0;
}

/* ── Header bar ── */
.game-header {
  width: 100%;
  padding: 14px 18px 0;
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}
.mission-label {
  font-size: 0.72rem; font-weight: 700;
  letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--text-dim);
  white-space: nowrap;
}
.score-display {
  margin-left: auto;
  font-size: 1.15rem; font-weight: 900;
  color: var(--neon-cyan);
  white-space: nowrap;
  text-shadow: 0 0 12px rgba(0,229,255,0.5);
  min-width: 56px; text-align: right;
}

/* ── Timer bar ── */
.timer-track {
  flex: 1;
  height: 5px;
  background: rgba(255,255,255,0.07);
  border-radius: 3px;
  overflow: hidden;
}
.timer-bar {
  height: 100%;
  width: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
  box-shadow: 0 0 8px var(--neon-cyan);
  transition: width 0.12s linear, background 0.6s ease;
}
.timer-bar.urgent {
  background: linear-gradient(90deg, var(--neon-red), #ff8800);
  box-shadow: 0 0 12px var(--neon-red);
  animation: urgentPulse 0.35s ease infinite alternate;
}
@keyframes urgentPulse {
  to { box-shadow: 0 0 22px var(--neon-red); }
}

/* ── Quest type label ── */
.quest-label {
  width: 100%;
  padding: 8px 18px 0;
  font-size: 0.82rem; font-weight: 800;
  letter-spacing: 1px;
  color: #f5c400;
  flex-shrink: 0;
}

/* ── Main content (image / audio button) ── */
.game-main {
  flex: 1; width: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 10px 20px;
  min-height: 0;
}

.main-img-wrap {
  width: min(210px, 36vw);
  height: min(210px, 36vw);
  border-radius: 14px;
  overflow: hidden;
  border: 4px solid #f5c400;
  border-bottom: 8px solid #c09500;
  box-shadow: 0 6px 0 rgba(0,0,0,0.35), 0 10px 24px rgba(0,0,0,0.4);
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.main-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.main-emoji { font-size: 4.5rem; line-height: 1; }

.btn-audio {
  width: min(150px, 34vw);
  height: min(150px, 34vw);
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--neon-cyan);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px;
  cursor: pointer;
  box-shadow: 0 0 30px rgba(0,229,255,0.28);
  transition: transform 0.3s var(--spring), box-shadow 0.3s var(--ease);
  color: var(--neon-cyan);
  font-family: var(--font);
  font-size: 0.65rem; font-weight: 700;
  letter-spacing: 2.5px; text-transform: uppercase;
}
.btn-audio:hover { transform: scale(1.07); box-shadow: 0 0 50px rgba(0,229,255,0.5); }
.btn-audio:active { transform: scale(0.94); }
.btn-audio svg { width: 44px; height: 44px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-audio.playing { animation: audioRing 0.55s ease infinite alternate; }
@keyframes audioRing { to { box-shadow: 0 0 65px rgba(0,229,255,0.7); } }

.btn-audio.invite {
  animation: invitePulse 0.9s ease infinite alternate;
  border-color: var(--neon-yellow);
  color: var(--neon-yellow);
}
@keyframes invitePulse {
  from { box-shadow: 0 0 20px rgba(255,214,0,0.4); transform: scale(1); }
  to   { box-shadow: 0 0 55px rgba(255,214,0,0.8); transform: scale(1.07); }
}

/* ── Choice tiles grid ── */
.tiles-grid {
  width: 100%;
  padding: 0 14px 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  flex-shrink: 0;
}

/* ── Lego brick tile ── */
.tile {
  background: #1d65c8;
  border: none;
  border-radius: 12px;
  border-bottom: 5px solid rgba(0,0,0,0.28);
  padding: 14px 10px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 7px;
  cursor: pointer;
  min-height: 88px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 5px 0 rgba(0,0,0,0.3), 0 8px 14px rgba(0,0,0,0.35);
  transition: transform 0.18s var(--spring), box-shadow 0.18s var(--ease);
}
/* top-surface gloss */
.tile::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(160deg, rgba(255,255,255,0.18) 0%, transparent 55%);
  pointer-events: none;
  border-radius: inherit;
}
/* two studs top-right */
.tile::after {
  content: '';
  position: absolute;
  top: 7px; right: 9px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.22);
  border: 1.5px solid rgba(0,0,0,0.18);
  box-shadow: -16px 0 0 rgba(255,255,255,0.22), -16px 0 0 1px rgba(0,0,0,0.14);
  pointer-events: none;
}
.tile:hover  { transform: translateY(-3px) scale(1.03); box-shadow: 0 9px 0 rgba(0,0,0,0.3), 0 14px 20px rgba(0,0,0,0.35); }
.tile:active { transform: translateY(2px)  scale(0.97) !important; box-shadow: 0 2px 0 rgba(0,0,0,0.3) !important; border-bottom-width: 2px; }

/* ── Lego 4-color palette ── */
.lego-r { background: #da1c1c; border-bottom-color: #a01212; }
.lego-b { background: #1d65c8; border-bottom-color: #1050a0; }
.lego-y { background: #f5c400; border-bottom-color: #c09500; color: #1a1a2e; }
.lego-g { background: #2db554; border-bottom-color: #1e8a3e; }
.lego-y .tile-text { color: #1a1a2e; }

.tile img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
.tile-emoji { font-size: 2.6rem; line-height: 1; }
.tile-text { font-size: clamp(0.9rem, 3vw, 1.05rem); font-weight: 900; text-align: center; line-height: 1.2; text-transform: lowercase; color: #fff; }

/* ── Tile answer states ── */
.tile.correct {
  background: #2db554 !important; border-bottom-color: #1e8a3e !important;
  box-shadow: 0 5px 0 rgba(0,0,0,0.3), 0 0 28px rgba(57,255,20,0.55) !important;
  animation: tileCorrectPop 0.4s var(--spring);
}
@keyframes tileCorrectPop {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.13); }
  100% { transform: scale(1); }
}
.tile.wrong {
  background: #da1c1c !important; border-bottom-color: #a01212 !important;
  animation: tileWrongShake 0.36s ease;
}
@keyframes tileWrongShake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-7px); }
  40%     { transform: translateX(7px); }
  60%     { transform: translateX(-4px); }
  80%     { transform: translateX(4px); }
}
.tile.reveal {
  background: #2db554 !important; border-bottom-color: #1e8a3e !important;
  box-shadow: 0 5px 0 rgba(0,0,0,0.3), 0 0 40px rgba(57,255,20,0.7) !important;
  animation: revealPulse 0.7s ease infinite alternate;
}
@keyframes revealPulse {
  to { box-shadow: 0 5px 0 rgba(0,0,0,0.3), 0 0 60px rgba(57,255,20,0.9) !important; }
}
.tile.locked { pointer-events: none; }
.tile.locked:not(.correct):not(.wrong):not(.reveal) { opacity: 0.5; }


/* ════════════════════════════════════════════
   COMBO BADGE
   ════════════════════════════════════════════ */
#combo-badge {
  position: fixed;
  top: 72px; left: 50%;
  transform: translateX(-50%) scale(0);
  background: linear-gradient(135deg, var(--neon-yellow), #ff8800);
  color: #08081a;
  font-weight: 900;
  font-size: 1.25rem;
  letter-spacing: 2px;
  padding: 10px 26px;
  border-radius: 50px;
  z-index: 200;
  pointer-events: none;
  box-shadow: 0 0 32px rgba(255,214,0,0.55);
  transition: transform 0.3s var(--spring), opacity 0.3s var(--ease);
  opacity: 0;
}
#combo-badge.show {
  transform: translateX(-50%) scale(1);
  opacity: 1;
}


/* ════════════════════════════════════════════
   GLITCH OVERLAY
   ════════════════════════════════════════════ */
#glitch-overlay {
  position: fixed; inset: 0;
  z-index: 300; pointer-events: none;
  opacity: 0;
  background: rgba(255, 35, 35, 0.16);
}
#glitch-overlay.active {
  animation: glitchFlash 0.42s steps(3) forwards;
}
@keyframes glitchFlash {
  0%   { opacity: 0;   transform: translate(0,0); }
  15%  { opacity: 1;   transform: translate(-4px, 2px); }
  30%  { opacity: 0.7; transform: translate(4px, -2px); }
  50%  { opacity: 0.9; transform: translate(-2px, 1px); }
  70%  { opacity: 0.4; transform: translate(2px, 3px); }
  100% { opacity: 0;   transform: translate(0,0); }
}


/* ════════════════════════════════════════════
   FEEDBACK OVERLAY (Dual-coding flash)
   ════════════════════════════════════════════ */
#feedback-overlay {
  position: fixed; inset: 0;
  z-index: 250;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px;
  background: rgba(8, 8, 26, 0.82);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.22s var(--ease);
}
#feedback-overlay.show { opacity: 1; }

.fb-img-wrap {
  width: min(180px, 40vw);
  height: min(180px, 40vw);
  border-radius: var(--radius);
  overflow: hidden;
  border: 3px solid var(--neon-green);
  box-shadow: 0 0 44px rgba(57,255,20,0.5);
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  animation: fbPop 0.38s var(--spring);
}
.fb-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.fb-img-emoji { font-size: 5rem; line-height: 1; }
@keyframes fbPop {
  from { transform: scale(0.45); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}

.fb-word {
  font-size: clamp(1.9rem, 6.5vw, 2.8rem);
  font-weight: 900;
  letter-spacing: -1px;
  text-transform: lowercase;
  background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fbWordUp 0.3s 0.08s var(--ease) both;
}
@keyframes fbWordUp {
  from { transform: translateY(18px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}


/* ════════════════════════════════════════════
   PARTICLES
   ════════════════════════════════════════════ */
.particle {
  position: fixed;
  pointer-events: none;
  z-index: 400;
  border-radius: 2px;
}


/* ════════════════════════════════════════════
   RESULTS SCREEN
   ════════════════════════════════════════════ */
#results {
  gap: 18px;
  overflow-y: auto;
  padding: 28px 20px;
}

.results-title {
  font-size: clamp(0.68rem, 2vw, 0.85rem);
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--text-dim);
  text-align: center;
}

.rank-badge {
  width: 118px; height: 118px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 3.8rem; font-weight: 900;
  border: 3px solid;
  animation: rankReveal 0.6s var(--spring);
  flex-shrink: 0;
}
@keyframes rankReveal {
  from { transform: scale(0) rotate(-180deg); opacity: 0; }
  to   { transform: scale(1) rotate(0deg);    opacity: 1; }
}
.rank-S { border-color: var(--neon-yellow); color: var(--neon-yellow); box-shadow: 0 0 44px rgba(255,214,0,0.5); }
.rank-A { border-color: var(--neon-cyan);   color: var(--neon-cyan);   box-shadow: 0 0 44px rgba(0,229,255,0.45); }
.rank-B { border-color: var(--neon-purple); color: var(--neon-purple); box-shadow: 0 0 44px rgba(191,64,255,0.4); }
.rank-C { border-color: var(--text-dim);    color: var(--text-dim); }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  width: 100%; max-width: 480px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 8px;
  text-align: center;
  display: flex; flex-direction: column; gap: 5px;
}
.stat-label {
  font-size: 0.62rem; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-dim);
}
.stat-value {
  font-size: clamp(1.4rem, 4.5vw, 1.9rem);
  font-weight: 900;
  color: var(--neon-cyan);
}

.pb-banner {
  background: linear-gradient(135deg, rgba(255,214,0,0.14), rgba(255,140,0,0.08));
  border: 1px solid rgba(255,214,0,0.35);
  border-radius: var(--radius);
  padding: 12px 22px;
  font-size: 0.85rem; font-weight: 700;
  color: var(--neon-yellow);
  text-align: center;
  letter-spacing: 1px;
  width: 100%; max-width: 480px;
}

.btn-retry {
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
  border: none; border-radius: 50px;
  padding: 16px 50px;
  font-family: var(--font);
  font-size: 1rem; font-weight: 900;
  color: #08081a;
  cursor: pointer;
  letter-spacing: 2px; text-transform: uppercase;
  box-shadow: 0 0 26px rgba(0,229,255,0.35);
  transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
  margin-top: 4px;
}
.btn-retry:hover { transform: scale(1.05); box-shadow: 0 0 42px rgba(0,229,255,0.55); }
.btn-retry:active { transform: scale(0.96); }

/* ── Mini leaderboard on results screen ── */
.mini-lb {
  width: 100%; max-width: 480px;
  display: flex; flex-direction: column; gap: 6px;
}
.mini-lb-title {
  font-size: 0.7rem; font-weight: 900;
  letter-spacing: 3px; text-transform: uppercase;
  color: var(--neon-yellow); text-align: center;
  margin-bottom: 2px;
}
.mini-lb-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 9px 14px;
  font-size: 0.88rem; font-weight: 800;
}
.mini-lb-row.is-current {
  border-color: var(--neon-yellow);
  background: rgba(255,214,0,0.1);
  box-shadow: 0 0 14px rgba(255,214,0,0.25);
}
.mini-lb-pos { font-size: 1.1rem; min-width: 28px; text-align: center; }
.mini-lb-name { flex: 1; }
.mini-lb-score { color: var(--neon-cyan); font-weight: 900; }
.mini-lb-avg   { font-size: 0.75rem; color: var(--text-dim); min-width: 36px; text-align: right; }
.mini-lb-rank  { font-size: 0.75rem; color: var(--text-dim); margin-left: 4px; }

/* ══════════════════════════════════════════
   NAME ENTRY SCREEN
   ══════════════════════════════════════════ */
#name-entry { gap: 20px; }

.name-entry-title {
  font-size: clamp(1.6rem, 6vw, 2.4rem);
  font-weight: 900;
  color: #f5c400;
  text-shadow: 1px 2px 0 #9a7400;
  text-align: center;
}
.name-entry-sub {
  font-size: 0.85rem; font-weight: 700;
  color: var(--text-dim); text-align: center;
  letter-spacing: 1px;
}
.name-input {
  width: 100%; max-width: 310px;
  background: rgba(255,255,255,0.08);
  border: 3px solid #f5c400;
  border-bottom: 5px solid #c09500;
  border-radius: 12px;

/* ================================================================

   ================================================================ */
const SUPABASE_URL     = "https://dvnvnplwrvnmoiqfwfsw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2bnZucGx3cnZubW9pcWZ3ZnN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMzI5NjEsImV4cCI6MjA4ODYwODk2MX0.1NSt-X8kiN_slDbdAZxTF1W0zLwjkZEE-ReL4TC_r74";
let _sbClient = null;
function getSupabase() {
  if (_sbClient) return _sbClient;
  try {
    if (window.supabase && window.supabase.createClient) {
      _sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    console.warn("Supabase init failed — leaderboard unavailable:", e);
  }
  return _sbClient;
}

/* ================================================================
   VOCAB MASTER — Modular Web App Template
   ─────────────────────────────────────────────────────────────────
   ARCHITECTURE OVERVIEW
   ─────────────────────────────────────────────────────────────────
   GAME_CONFIG      — single source of truth for all content & rules
   CloudManager     — data persistence layer (Supabase game_scores)
   AssetLoader      — preloads img/audio before game starts
   GameEngine       — pure logic functions, zero DOM access
   MissionRegistry  — open registry; add new mission types here
   UIRenderer       — all DOM manipulation, zero game logic
   GameState        — mutable runtime state object
   GameController   — thin orchestration layer
   ================================================================ */


/* ================================================================
   1. GAME_CONFIG
   Edit this single object to change all game content & difficulty.
   ================================================================ */
const GAME_CONFIG = {

  META: {
    TITLE:          "Vocab Master",
    SUBTITLE:       "Unit 5 · Animals & Homes",
    UNIT_TAG:       "Unit 5",
    /* Change STORAGE_SUFFIX when deploying a new unit so scores
       don't bleed across different vocabulary sets.              */
    STORAGE_SUFFIX: "unit5_v1",
  },

  SETTINGS: {
    TIMER_SEC:   15,     // seconds per question
    COMBO_MS:    3000,   // max ms to count as a combo answer
    MAX_LB_SIZE: 20,     // max leaderboard entries kept in storage
    POINTS: {
      fast: 150,   // answered in < 2 s
      mid:  120,   // answered in 2–4.5 s
      slow: 100,   // answered in 4.5–7 s
      late:  80,   // answered after 7 s
    },
    RANK: {
      S: { minAcc: 90, maxAvgSec: 4 },
      A: { minAcc: 75, maxAvgSec: 6 },
      B: { minAcc: 55, maxAvgSec: Infinity },
      // anything below B thresholds → C
    },
  },

  /* ── Vocabulary bank ──────────────────────────────────────────
     Fields:
       word  : target English word (string)
       img   : relative path to image, e.g. "images/chick.jpg"  (or "")
       audio : relative path to audio, e.g. "audio/chick.mp3"   (or "")
       sfx   : reserved for future per-word sound effects        (or "")
     If img/audio paths return 404, the game gracefully falls
     back to the EMOJI map / Text-to-Speech automatically.
  ──────────────────────────────────────────────────────────────── */
  WORDS: [
    { word: "Chick",       img: "images/chick.jpg",        audio: "audio/chick.mp3",        sfx: "" },
    { word: "Crab",        img: "images/crab.jpg",         audio: "audio/crab.mp3",         sfx: "" },
    { word: "Eagle",       img: "images/eagle.jpg",        audio: "audio/eagle.mp3",        sfx: "" },
    { word: "Hive",        img: "images/hive.jpg",         audio: "audio/hive.mp3",         sfx: "" },
    { word: "Honeybee",    img: "images/honeybee.jpg",     audio: "audio/honeybee.mp3",     sfx: "" },
    { word: "Nest",        img: "images/nest.jpg",         audio: "audio/nest.mp3",         sfx: "" },
    { word: "Opossum",     img: "images/opossum.jpg",      audio: "audio/opossum.mp3",      sfx: "" },
    { word: "Tree Hollow", img: "images/tree_hollow.jpg",  audio: "audio/tree_hollow.mp3",  sfx: "" },
  ],

  /* ── Emoji fallback map ───────────────────────────────────────
     Shown when no img path is provided or when the img 404s.
     Add entries freely; keys must be lowercase word strings.
  ──────────────────────────────────────────────────────────────── */
  EMOJI: {
    // Unit 5
    chick: "🐥",         crab: "🦀",          eagle: "🦅",         hive: "🍯",
    honeybee: "🐝",      nest: "🪺",           opossum: "🐾",       "tree hollow": "🌳",
    // General fallbacks
    butterfly: "🦋",     caterpillar: "🐛",    dragonfly: "🪲",     grasshopper: "🦗",
    ladybug: "🐞",       beetle: "🪲",         ant: "🐜",           bee: "🐝",
    dog: "🐶",           cat: "🐱",            bird: "🐦",          fish: "🐟",
  },

};

/* Convenience helper — never throws */
const emoji = w => GAME_CONFIG.EMOJI[w.toLowerCase()] || "❓";


/* ================================================================
   2. CLOUD MANAGER
   Hall of Fame stored in Supabase game_scores table.
   Personal best remains in localStorage.
   ================================================================ */
const CloudManager = {

  _pbKey() { return `vocabMasterPB_${GAME_CONFIG.META.STORAGE_SUFFIX}`; },

  /* ── Personal Best (local only) ── */
  getPB()   { try { return JSON.parse(localStorage.getItem(this._pbKey())); } catch (_) { return null; } },
  savePB(d) { try { localStorage.setItem(this._pbKey(), JSON.stringify(d)); } catch (_) {} },

  /**
   * saveScore(name, score, rank, accuracy, totalTime, avgTime)
   * Inserts into Supabase game_scores. Returns a Promise that resolves when done.
   */
  saveScore(name, score, rank, accuracy = 0, totalTime = 0, avgTime = 0) {
    const sb = getSupabase();
    if (!sb) return Promise.resolve();
    return sb
      .from("game_scores")
      .insert({
        username: name,
        total_score: score,
        accuracy: Number(accuracy),
        total_time: Number(totalTime),
        avg_time: Number(avgTime),
      })
      .then(({ error }) => {
        if (error) console.warn("Cloud save failed:", error);
      });
  },

  /**
   * fetchLeaderboard()
   * Returns a Promise that resolves with the top 20 scores from Supabase,
   * ordered by total_score descending. Each entry: { name, score, rank }.
   */
  fetchLeaderboard() {
    const sb = getSupabase();
    if (!sb) return Promise.resolve([]);
    return sb
      .from("game_scores")
      .select("username, total_score, accuracy, avg_time")
      .order("total_score", { ascending: false })
      .order("avg_time",    { ascending: true })
      .limit(20)
      .then(({ data, error }) => {
        if (error) {
          console.warn("Leaderboard fetch failed:", error);
          return [];
        }
        return (data || []).map((row) => ({
          name:    row.username,
          score:   row.total_score,
          avgTime: row.avg_time ?? 0,
          rank:    GameEngine.getRank(row.accuracy ?? 0, row.avg_time ?? 0),
        }));
      });
  },

  clearAll() {
    /* Leaderboard is cloud-only; only clear local PB cache if desired */
    try { localStorage.removeItem(this._pbKey()); } catch (_) {}
  },
};


/* ================================================================
   3. ASSET PRELOADER
   Iterates GAME_CONFIG.WORDS, preloads every img and audio file.
   Broken assets are counted as failures (graceful degradation).
   A per-file timeout prevents the splash from hanging forever.
   ================================================================ */
const AssetLoader = {

  /* Keyed by src path — holds the pre-loaded Audio elements so playback
     can reuse them without a fresh download or MP3 decode on every question. */
  audioCache: {},

  preload(onProgress, onComplete) {
    const assets = [];
    GAME_CONFIG.WORDS.forEach(item => {
      if (item.img)   assets.push({ type: "img",   src: item.img });
      if (item.audio) assets.push({ type: "audio", src: item.audio });
    });

    const total = assets.length;
    let loaded  = 0;
    let done    = false;

    if (total === 0) { onComplete(); return; }

    const finish = () => {
      if (done) return;
      done = true;
      onComplete();
    };

    const tick = () => {
      loaded++;
      onProgress(loaded, total);
      if (loaded >= total) finish();
    };

    /* Global safety net — unblocks the splash after 8 s regardless */
    const safetyTimer = setTimeout(() => {
      if (!done) {
        console.warn("Asset preload timed out — starting game with cached assets.");
        finish();
      }
    }, 8000);

    /* Wrap onComplete so it also clears the safety timer */
    const origComplete = onComplete;
    onComplete = () => { clearTimeout(safetyTimer); origComplete(); };

    assets.forEach(({ type, src }) => {
      if (type === "img") {
        const img   = new Image();
        img.onload  = tick;
        /* On 404: img falls back to emoji at render time */
        img.onerror = tick;
        img.src     = src;

      } else {
        /* Audio: guard against canplaythrough never firing on
           some mobile browsers with a per-file 3 s timeout.   */
        let fired = false;
        const once = () => { if (!fired) { fired = true; tick(); } };
        const au  = new Audio();
        au.addEventListener("canplaythrough", once, { once: true });
        /* On 404: audio falls back to TTS at playback time */
        au.addEventListener("error", once, { once: true });
        au.preload = "auto";
        au.src     = src;
        AssetLoader.audioCache[src] = au; /* keep alive for reuse */
        setTimeout(once, 3000);
      }
    });
  },
};


/* ================================================================
   AUDIO ENGINE  (Web Audio API synth + file playback + TTS fallback)
   ================================================================ */
const Snd = (() => {
  let ctx = null;
  const getCtx = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  };

  function beep(freq, dur, type = "sine", vol = 0.28) {
    try {
      const ac   = getCtx();
      const osc  = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      osc.start();
      osc.stop(ac.currentTime + dur);
    } catch (_) {}
  }

  const correct = () => { beep(880, 0.1); setTimeout(() => beep(1108, 0.16), 95); };
  const wrong   = () => beep(180, 0.38, "sawtooth", 0.22);
  const combo   = () => [660, 880, 1108, 1320].forEach((f, i) => setTimeout(() => beep(f, 0.1), i * 65));

  function speak(word, onEnd) {
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
      const u    = new SpeechSynthesisUtterance(word);
      u.rate     = 0.82;
      u.pitch    = 1.05;
      if (onEnd) u.onend = onEnd;
      window.speechSynthesis.speak(u);
    } else {
      beep(440, 0.2);
      onEnd && setTimeout(onEnd, 300);
    }
  }

  function playFile(src, word, onEnd) {
    if (!src) { speak(word, onEnd); return; }
    try {
      const a = AssetLoader.audioCache[src] || new Audio(src);
      a.currentTime = 0; /* reset in case already played */
      if (onEnd) a.addEventListener("ended", onEnd, { once: true });
      /* Guard: only call TTS once even if both error and catch fire */
      let ttsUsed = false;
      const fallback = () => { if (!ttsUsed) { ttsUsed = true; speak(word, onEnd); } };
      a.addEventListener("error", fallback, { once: true });
      a.play().catch(fallback);
    } catch (_) { speak(word, onEnd); }
  }

  function playWord(item, onEnd) {
    if (item.audio) playFile(item.audio, item.word, onEnd);
    else speak(item.word, onEnd);
  }

  /**
   * unlock()
   * Called once on the first real user gesture (pressing GO).
   * iOS Safari and Android Chrome require a direct user-gesture interaction
   * before any Audio.play() or AudioContext call is permitted.
   * Playing a silent audio and resuming the AudioContext here "unlocks"
   * the audio system for the entire session.
   */
  function unlock() {
    /* Resume Web Audio context (needed for beep sounds on mobile) */
    try {
      const ac = getCtx();
      if (ac.state === "suspended") ac.resume();
    } catch (_) {}

    /* Unlock HTMLAudioElement playback (needed for .mp3 files on iOS) */
    try {
      const s = new Audio();
      /* Smallest valid silent WAV: 44-byte RIFF header, 0 audio frames */
      s.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
      s.volume = 0;
      s.play().then(() => s.pause()).catch(() => {});
    } catch (_) {}

    /* Pre-warm the iOS TTS engine so first-use delay is eliminated.
       iOS SpeechSynthesis takes 2-5 s to initialise on the very first
       call; speaking a silent utterance here during the user gesture
       means the engine is ready before the first audio mission. */
    try {
      if (window.speechSynthesis) {
        const warmup = new SpeechSynthesisUtterance(" ");
        warmup.volume = 0;
        window.speechSynthesis.speak(warmup);
      }
    } catch (_) {}
  }

  return { correct, wrong, combo, speak, playWord, unlock };
})();


/* ================================================================
   PARTICLE SYSTEM
   ================================================================ */
function burst(el) {
  const r       = el.getBoundingClientRect();
  const cx      = r.left + r.width  / 2;
  const cy      = r.top  + r.height / 2;
  const palette = ["#00e5ff", "#39ff14", "#ffd600", "#bf40ff", "#ffffff", "#ff8800"];

  for (let i = 0; i < 24; i++) {
    const p     = document.createElement("div");
    p.className = "particle";
    const angle = Math.random() * Math.PI * 2;
    const speed = 70 + Math.random() * 170;
    const color = palette[Math.floor(Math.random() * palette.length)];
    const size  = 5 + Math.random() * 9;
    p.style.cssText = `
      left:${cx}px; top:${cy}px;
      width:${size}px; height:${size}px;
      background:${color};
      box-shadow:0 0 6px ${color};
      border-radius:${Math.random() > 0.45 ? "50%" : "2px"};
    `;
    document.body.appendChild(p);
    p.animate(
      [
        { transform: "translate(-50%,-50%) scale(1)",   opacity: 1 },
        { transform: `translate(calc(-50% + ${Math.cos(angle) * speed}px), calc(-50% + ${Math.sin(angle) * speed}px)) scale(0)`, opacity: 0 },
      ],
      { duration: 520 + Math.random() * 380, easing: "cubic-bezier(0,0,0.2,1)", fill: "forwards" }
    ).onfinish = () => p.remove();
  }
}


/* ================================================================
   SHARED DISPLAY CONSTANTS
   ================================================================ */
const HOF_MEDALS  = ["🥇", "🥈", "🥉", "4", "5", "6", "7", "8", "9", "10"];
const RANK_COLORS = { S: "#ffd600", A: "#00e5ff", B: "#bf40ff", C: "rgba(240,240,255,0.4)" };
const COMBO_LABELS = ["", "⚡ GREAT!", "🔥 GREAT!", "💥 PERFECT!", "🌟 PERFECT!", "⭐ LEGENDARY!"];


/* ================================================================
   4a. GAME ENGINE  (pure logic — zero DOM access)
   ================================================================ */
const GameEngine = {

  shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },

  distractors(target, n) {
    return this.shuffle(
      GAME_CONFIG.WORDS.filter(v => v.word !== target.word)
    ).slice(0, n);
  },

  /**
   * buildMissions()
   * Returns a shuffled array of mission objects.
   * To change the mission mix, edit only this function.
   */
  buildMissions() {
    const pool = [];

    /* Round 1 — every word gets one VISUAL_MATCH */
    GAME_CONFIG.WORDS.forEach(item =>
      pool.push({ type: "VISUAL_MATCH", target: item })
    );

    /* Round 2 — split evenly between SONIC_MATCH and SPELL_MATCH */
    const shuffled = this.shuffle([...GAME_CONFIG.WORDS]);
    const half     = Math.ceil(shuffled.length / 2);
    shuffled.forEach((item, idx) =>
      pool.push({ type: idx < half ? "SONIC_MATCH" : "SPELL_MATCH", target: item })
    );

    return this.shuffle(pool);
  },

  pointsFor(ms) {
    const { fast, mid, slow, late } = GAME_CONFIG.SETTINGS.POINTS;
    if (ms < 2000) return fast;
    if (ms < 4500) return mid;
    if (ms < 7000) return slow;
    return late;
  },

  getRank(acc, avgSec) {
    const { S, A } = GAME_CONFIG.SETTINGS.RANK;
    if (acc >= S.minAcc && avgSec < S.maxAvgSec) return "S";
    if (acc >= A.minAcc && avgSec < A.maxAvgSec) return "A";
    if (acc >= 55) return "B";
    return "C";
  },
};


/* ================================================================
   4b. MISSION REGISTRY  (extensible mission types)
   ─────────────────────────────────────────────────────────────────
   To add a new mission type (e.g. "DEFINITION_MATCH"):
     1. Call MissionRegistry.register("DEFINITION_MATCH", { ... })
     2. Include the new type in GameEngine.buildMissions()
   No other changes needed anywhere in the engine or renderer.

   Config shape per type:
     label           : string shown in the quest-label bar
     buildMain(t)    : returns a DOM node for #game-main
     buildTileContent(item) : returns array of DOM nodes for a tile
     onLoad(target)  : called after the mission renders (e.g. auto-play)
   ================================================================ */
const MissionRegistry = (() => {
  const _types = {};
  return {
    register(typeId, config) { _types[typeId] = config; },
    get(typeId)               { return _types[typeId]; },
  };
})();


/* ================================================================
   UI RENDERER  (all DOM manipulation — zero game logic)
   ================================================================ */
const UIRenderer = {

  /* ─── Shared DOM helpers ───────────────────────────────────── */

  /**
   * imageOrEmoji(item, fallbackClass)
   * Returns an <img> if item.img exists, otherwise a <div> with emoji.
   * Attaches an onerror handler so a broken img auto-swaps to emoji.
   */
  imageOrEmoji(item, fallbackClass) {
    if (item.img) {
      const img   = document.createElement("img");
      img.src     = item.img;
      img.alt     = item.word;
      img.addEventListener("error", () => {
        const fb       = document.createElement("div");
        fb.className   = fallbackClass;
        fb.textContent = emoji(item.word);
        img.replaceWith(fb);
      });
      return img;
    }
    const fb       = document.createElement("div");
    fb.className   = fallbackClass;
    fb.textContent = emoji(item.word);
    return fb;
  },

  /**
   * audioButton(target)
   * Returns the circular TAP-TO-PLAY button used by audio missions.
   * Click is handled via addEventListener — no global references.
   */
  audioButton(target) {
    const btn     = document.createElement("button");
    btn.className = "btn-audio invite";
    btn.id        = "audio-btn";
    btn.innerHTML = `
      <svg viewBox="0 0 24 24">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      TAP TO PLAY`;
    btn.addEventListener("click", () => GameController.triggerAudioBtn(target));
    return btn;
  },

  /* ─── Game screen renderers ────────────────────────────────── */

  renderMain(type, target) {
    const main    = document.getElementById("game-main");
    main.innerHTML = "";
    const mission = MissionRegistry.get(type);
    if (mission) main.appendChild(mission.buildMain(target));
  },

  renderTiles(type, target, choices) {
    const grid      = document.getElementById("tiles-grid");
    grid.innerHTML  = "";
    const LEGO      = ["lego-r", "lego-b", "lego-y", "lego-g"];
    const mission   = MissionRegistry.get(type);

    choices.forEach((item, idx) => {
      const tile        = document.createElement("div");
      tile.className    = `tile ${LEGO[idx % 4]}`;
      tile.dataset.word = item.word;

      if (mission) {
        mission.buildTileContent(item).forEach(el => tile.appendChild(el));
      }

      tile.addEventListener("click", () =>
        GameController.handleAnswer(item.word === target.word, tile, target)
      );
      grid.appendChild(tile);
    });
  },

  /* ─── Feedback overlay ─────────────────────────────────────── */

  showFeedback(target) {
    const ov       = document.getElementById("feedback-overlay");
    ov.innerHTML   = "";
    const wrap     = document.createElement("div");
    wrap.className = "fb-img-wrap";
    wrap.appendChild(this.imageOrEmoji(target, "fb-img-emoji"));

    const wordEl       = document.createElement("div");
    wordEl.className   = "fb-word";
    wordEl.textContent = target.word.toLowerCase();

    ov.appendChild(wrap);
    ov.appendChild(wordEl);
    ov.classList.add("show");
    Snd.speak(target.word);
  },

  hideFeedback() {
    document.getElementById("feedback-overlay").classList.remove("show");
  },

  /* ─── Visual effects ───────────────────────────────────────── */

  triggerGlitch() {
    const g = document.getElementById("glitch-overlay");
    g.classList.remove("active");
    void g.offsetWidth; // force reflow to restart animation
    g.classList.add("active");
    setTimeout(() => g.classList.remove("active"), 480);
  },

  showCombo(streak) {
    const badge       = document.getElementById("combo-badge");
    badge.textContent = COMBO_LABELS[Math.min(streak, COMBO_LABELS.length - 1)];
    badge.classList.add("show");
    clearTimeout(this._comboClear);
    this._comboClear = setTimeout(() => badge.classList.remove("show"), 1150);
  },

  /* ─── Screen transitions ───────────────────────────────────── */

  showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  },

  /* ─── Leaderboard / Results renderers ─────────────────────── */

  /**
   * buildMiniLb(currentName, currentScore, lb)
   * Renders the mini leaderboard on the results screen.
   * Accepts lb as a parameter — no direct storage access.
   */
  buildMiniLb(currentName, currentScore, lb) {
    const el       = document.getElementById("mini-lb");
    el.innerHTML   = "";
    if (!lb || lb.length === 0) return;

    el.innerHTML = `<div class="mini-lb-title">🏆 Top Scores</div>`;
    lb.slice(0, 5).forEach((entry, i) => {
      const isMe = entry.name  === currentName
                && entry.score === currentScore
                && i === lb.findIndex(e => e.name === currentName && e.score === currentScore);
      const row       = document.createElement("div");
      row.className   = "mini-lb-row" + (isMe ? " is-current" : "");
      row.innerHTML   = `
        <span class="mini-lb-pos">${HOF_MEDALS[i] || (i + 1)}</span>
        <span class="mini-lb-name">${entry.name}</span>
        <span class="mini-lb-score">${entry.score}</span>
        <span class="mini-lb-avg">${entry.avgTime ? entry.avgTime.toFixed(1) + "s" : "—"}</span>
        <span class="mini-lb-rank">${entry.rank}</span>
      `;
      el.appendChild(row);
    });
  },

  /**
   * renderHallOfFame(lb, highlightName)
   * Renders the full leaderboard list. Accepts lb as a parameter.
   */
  renderHallOfFame(lb, highlightName) {
    const list     = document.getElementById("hof-list");
    list.innerHTML = "";
    if (!lb || lb.length === 0) {
      list.innerHTML = `<div class="hof-empty">No scores yet — be the first! 🚀</div>`;
      return;
    }
    lb.slice(0, 5).forEach((entry, i) => {
      const isMe    = highlightName
                   && entry.name === highlightName
                   && i === lb.findIndex(e => e.name === highlightName);
      const row         = document.createElement("div");
      row.className     = "hof-entry" + (isMe ? " hof-highlight" : "");
      row.style.animationDelay = (i * 0.07) + "s";
      row.innerHTML     = `
        <span class="hof-pos">${HOF_MEDALS[i] || (i + 1)}</span>
        <span class="hof-name">${entry.name}</span>
        <span class="hof-score">${entry.score} pts</span>
        <span class="hof-avg">${entry.avgTime ? entry.avgTime.toFixed(1) + "s" : "—"}</span>
        <span class="hof-rank-chip" style="color:${RANK_COLORS[entry.rank] || "#fff"}">${entry.rank}</span>
      `;
      list.appendChild(row);
    });
  },
};

/* ================================================================
   GAME STATE  (mutable runtime values — separate from config)
   ================================================================ */
const GameState = {
  missions:     [],
  missionIdx:   0,
  score:        0,
  correctCount: 0,
  totalAnswered:0,
  speedLog:     [],
  qStart:       0,
  timerRAF:     null,
  timerEnd:     0,
  answered:     false,
  comboStreak:  0,
  currentPlayer:"",

  reset() {
    this.missions      = [];
    this.missionIdx    = 0;
    this.score         = 0;
    this.correctCount  = 0;
    this.totalAnswered = 0;
    this.speedLog      = [];
    this.comboStreak   = 0;
    this.answered      = false;
  },
};


/* ================================================================
   GAME CONTROLLER  (thin orchestration layer)
   Connects GameEngine + UIRenderer + CloudManager + GameState.
   ================================================================ */
const GameController = {

  /* ─── Boot ─────────────────────────────────────────────────── */

  init() {
    this._syncMetaToDOM();
    UIRenderer.showScreen("splash");

    const btnStart  = document.getElementById("btn-start");
    const statusEl  = document.getElementById("loading-status");
    btnStart.disabled = true;

    AssetLoader.preload(
      (loaded, total) => {
        const pct = Math.round((loaded / total) * 100);
        statusEl.textContent = `LOADING ASSETS… ${pct}%`;
      },
      () => {
        statusEl.textContent = "✓  READY!";
        statusEl.classList.add("ready");
        btnStart.disabled = false;
        setTimeout(() => { statusEl.style.display = "none"; }, 900);
        /* Refresh the best-score line now that storage is read */
        this._refreshSplashPB();
      }
    );
  },

  _syncMetaToDOM() {
    const sub = document.getElementById("splash-sub");
    if (sub) sub.textContent = GAME_CONFIG.META.SUBTITLE;
    const hofSub = document.getElementById("hof-subtitle");
    if (hofSub) hofSub.textContent = `${GAME_CONFIG.META.UNIT_TAG} · Top Players`;
  },

  _refreshSplashPB() {
    CloudManager.fetchLeaderboard().then(lb => {
      const best = lb[0];
      document.getElementById("splash-pb").textContent =
        best ? `${best.name}  ${best.score} pts (${best.rank})` : "—";
    });
  },

  /* ─── Name Entry ───────────────────────────────────────────── */

  showNameEntry() {
    const input = document.getElementById("player-name-input");
    input.value = "";
    document.getElementById("btn-go").disabled = true;
    UIRenderer.showScreen("name-entry");
    setTimeout(() => input.focus(), 300);
  },

  onNameInput() {
    const val = document.getElementById("player-name-input").value.trim();
    document.getElementById("btn-go").disabled = val.length === 0;
  },

  onNameKey(e) {
    if (e.key === "Enter") this.startGameForPlayer();
  },

  startGameForPlayer() {
    const val = document.getElementById("player-name-input").value.trim();
    if (!val) return;
    GameState.currentPlayer = val;
    Snd.unlock(); /* unlock iOS/Android audio on the confirmed user gesture */
    this.startGame();
  },

  /* ─── Hall of Fame ─────────────────────────────────────────── */

  showHallOfFame(highlightName) {
    CloudManager.fetchLeaderboard().then(lb => {
      UIRenderer.renderHallOfFame(lb, highlightName);
      UIRenderer.showScreen("hall-of-fame");
    });
  },

  clearLeaderboard() {
    if (!confirm("Clear the whole leaderboard? This can't be undone.")) return;
    CloudManager.clearAll();
    this.showHallOfFame();
  },

  /* ─── Game Start ───────────────────────────────────────────── */

  startGame() {
    GameState.reset();
    GameState.missions = GameEngine.buildMissions();
    document.getElementById("score-display").textContent = "0";
    UIRenderer.showScreen("game");
    this.nextMission();
  },

  /* ─── Mission Lifecycle ────────────────────────────────────── */

  nextMission() {
    if (GameState.missionIdx >= GameState.missions.length) {
      this.showResults();
      return;
    }

    GameState.answered = false;
    const { type, target } = GameState.missions[GameState.missionIdx];
    const total           = GameState.missions.length;

    document.getElementById("mission-label").textContent =
      `MISSION ${GameState.missionIdx + 1} / ${total}`;

    const mission = MissionRegistry.get(type);
    document.getElementById("quest-label").textContent =
      mission ? mission.label : type;

    const choices = GameEngine.shuffle([target, ...GameEngine.distractors(target, 3)]);
    UIRenderer.renderMain(type, target);
    UIRenderer.renderTiles(type, target, choices);
    this._startTimer();

    if (mission) mission.onLoad(target);
    GameState.qStart = Date.now();
  },

  /* ─── Audio Playback ───────────────────────────────────────── */

  /**
   * autoPlayWord(target)
   * Called by mission.onLoad() for audio-based missions.
   * Attempts to play the audio file; falls back to TTS on any error.
   */
  autoPlayWord(target) {
    const btn = document.getElementById("audio-btn");
    if (target.audio) {
      const a = AssetLoader.audioCache[target.audio] || new Audio(target.audio);
      a.currentTime = 0; /* reset in case already played */
      /* Guard: only trigger TTS once even if both error and catch fire */
      let ttsUsed = false;
      const fallback = () => {
        if (ttsUsed) return;
        ttsUsed = true;
        Snd.speak(target.word);
        if (btn) btn.classList.remove("invite");
      };
      a.addEventListener("error", fallback, { once: true });
      const p = a.play();
      if (p !== undefined) {
        p.then(() => { if (btn) btn.classList.remove("invite"); })
         .catch(fallback);
      }
    } else {
      Snd.speak(target.word);
    }
  },

  triggerAudioBtn(target) {
    const btn = document.getElementById("audio-btn");
    if (btn) {
      btn.classList.remove("invite");
      btn.classList.add("playing");
      setTimeout(() => btn.classList.remove("playing"), 1100);
    }
    Snd.playWord(target);
  },

  /* ─── Answer Handling ──────────────────────────────────────── */

  handleAnswer(isCorrect, tileEl, target) {
    if (GameState.answered) return;
    GameState.answered = true;
    this._stopTimer();

    const elapsed = Date.now() - GameState.qStart;
    GameState.totalAnswered++;
    GameState.speedLog.push(elapsed);
    this._lockTiles();

    if (isCorrect) {
      GameState.correctCount++;
      const pts       = GameEngine.pointsFor(elapsed);
      GameState.score += pts;
      document.getElementById("score-display").textContent = GameState.score;

      tileEl.classList.add("correct");
      burst(tileEl);
      Snd.correct();

      if (elapsed < GAME_CONFIG.SETTINGS.COMBO_MS) {
        GameState.comboStreak++;
        UIRenderer.showCombo(GameState.comboStreak);
        if (GameState.comboStreak >= 3) Snd.combo();
      } else {
        GameState.comboStreak = 0;
      }

      setTimeout(() => UIRenderer.showFeedback(target),  280);
      setTimeout(() => UIRenderer.hideFeedback(),        1580);
      setTimeout(() => this._advance(),                  1800);

    } else {
      GameState.comboStreak = 0;
      tileEl.classList.add("wrong");
      UIRenderer.triggerGlitch();
      Snd.wrong();
      this._revealCorrect(target.word);
      setTimeout(() => this._advance(), 1900);
    }
  },

  _lockTiles() {
    document.querySelectorAll(".tile").forEach(t => t.classList.add("locked"));
  },

  _revealCorrect(word) {
    document.querySelectorAll(".tile").forEach(t => {
      if (t.dataset.word === word && !t.classList.contains("correct"))
        t.classList.add("reveal");
    });
  },

  _advance() {
    GameState.missionIdx++;
    this.nextMission();
  },

  /* ─── Timer ────────────────────────────────────────────────── */

  _startTimer() {
    this._stopTimer();
    const S        = GAME_CONFIG.SETTINGS.TIMER_SEC;
    GameState.timerEnd = performance.now() + S * 1000;
    const bar      = document.getElementById("timer-bar");
    bar.style.width = "100%";
    bar.classList.remove("urgent");

    const tick = now => {
      if (GameState.answered) return;
      const remaining = Math.max(0, GameState.timerEnd - now);
      const pct       = (remaining / (S * 1000)) * 100;
      bar.style.width = pct + "%";
      if (pct < 30 && !bar.classList.contains("urgent")) bar.classList.add("urgent");
      if (remaining <= 0) { this._onTimeout(); return; }
      GameState.timerRAF = requestAnimationFrame(tick);
    };
    GameState.timerRAF = requestAnimationFrame(tick);
  },

  _stopTimer() {
    if (GameState.timerRAF) {
      cancelAnimationFrame(GameState.timerRAF);
      GameState.timerRAF = null;
    }
  },

  _onTimeout() {
    if (GameState.answered) return;
    GameState.answered = true;
    GameState.totalAnswered++;
    GameState.comboStreak = 0;
    Snd.wrong();
    UIRenderer.triggerGlitch();
    this._revealCorrect(GameState.missions[GameState.missionIdx].target.word);
    setTimeout(() => this._advance(), 1900);
  },

  /* ─── Results ──────────────────────────────────────────────── */

  showResults() {
    this._stopTimer();
    UIRenderer.hideFeedback();

    const accuracy = GameState.totalAnswered > 0
      ? Math.round((GameState.correctCount / GameState.totalAnswered) * 100)
      : 0;

    const avgSec = GameState.speedLog.length > 0
      ? +(GameState.speedLog.reduce((a, b) => a + b, 0) / GameState.speedLog.length / 1000).toFixed(1)
      : GAME_CONFIG.SETTINGS.TIMER_SEC;

    const rank  = GameEngine.getRank(accuracy, avgSec);
    const name  = GameState.currentPlayer || "Player";
    const score = GameState.score;

    /* total_time: sum of all response times in seconds (speedLog is in ms) */
    const totalTimeSec = GameState.speedLog.length > 0
      ? +(GameState.speedLog.reduce((a, b) => a + b, 0) / 1000).toFixed(1)
      : 0;

    document.getElementById("res-player-name").textContent = `${name}  ·  ${rank} Rank`;
    document.getElementById("res-score").textContent       = score;
    document.getElementById("res-accuracy").textContent    = accuracy + "%";
    document.getElementById("res-speed").textContent       = avgSec + "s";

    const rankEl     = document.getElementById("rank-badge");
    rankEl.textContent = rank;
    rankEl.className   = `rank-badge rank-${rank}`;

    /* Save score to Supabase (async), then fetch leaderboard for mini lb */
    const updateMiniLb = () =>
      CloudManager.fetchLeaderboard().then(fetched =>
        UIRenderer.buildMiniLb(name, score, fetched)
      );
    if (score > 0 && GameState.currentPlayer) {
      CloudManager.saveScore(GameState.currentPlayer, score, rank, accuracy, totalTimeSec, avgSec)
        .then(updateMiniLb)
        .catch(() => updateMiniLb());
    } else {
      updateMiniLb();
    }

    /* Personal Best banner (local) */
    const pb       = CloudManager.getPB();
    const pbBanner = document.getElementById("pb-banner");
    if (!pb || score > pb.score) {
      if (score > 0) CloudManager.savePB({ score, rank, accuracy, date: Date.now() });
      pbBanner.textContent   = score > 0 ? "⭐  NEW PERSONAL BEST!" : "";
      pbBanner.style.display = score > 0 ? "" : "none";
    } else {
      pbBanner.textContent   = `Your Best: ${pb.score} pts  (${pb.rank})`;
      pbBanner.style.display = "";
    }

    UIRenderer.showScreen("results");
  },
};


/* ================================================================
   GLOBAL WRAPPERS
   These thin wrappers preserve all existing onclick="…" attributes
   in the HTML — no markup changes required.
   ================================================================ */
function showNameEntry()        { GameController.showNameEntry(); }
function onNameInput()          { GameController.onNameInput(); }
function onNameKey(e)           { GameController.onNameKey(e); }
function startGameForPlayer()   { GameController.startGameForPlayer(); }
function showHallOfFame(h)      { GameController.showHallOfFame(h); }
function clearLeaderboard()     { GameController.clearLeaderboard(); }


/* ================================================================
   BOOT
   ================================================================ */
GameController.init();
</script>
